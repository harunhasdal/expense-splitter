name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.3"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy . --strict
      - run: uv run pytest tests/
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          COGNITO_REGION: "eu-west-1"
          COGNITO_USER_POOL_ID: "eu-west-1_TEST"
          COGNITO_CLIENT_ID: "test-client-id"
          COGNITO_CLIENT_SECRET: "test-client-secret"
          COGNITO_DOMAIN: "test-domain"
          JWT_EXPIRY_SECONDS: "86400"
          ALLOWED_ORIGINS: '["http://localhost:5173"]'
          CSRF_SECRET_KEY: "test-secret-key-minimum-32-chars!!"
          APP_BASE_URL: "http://localhost:8000"
      # PYSEC-2026-1325 (ecdsa): Minerva timing side-channel in ECDSA signing.
      # No upstream fix exists, and the code path is unreachable here — our JWT
      # verification uses RS256 (RSA) only, never the ecdsa package's ECDSA path.
      # The gate stays hard for every other current and future advisory.
      - run: uv run pip-audit --ignore-vuln PYSEC-2026-1325

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run build
