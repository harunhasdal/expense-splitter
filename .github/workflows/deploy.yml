name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - run: |
          # --target runtime: the Dockerfile's last stage is `dev` (root, --reload),
          # so an untargeted build would ship the dev image. --platform pins amd64
          # to match the X86_64 Fargate task definition.
          docker build --target runtime --platform linux/amd64 \
            -t ${{ vars.ECR_REGISTRY }}/expense-splitter-api:${{ steps.meta.outputs.sha }} backend/
          docker push ${{ vars.ECR_REGISTRY }}/expense-splitter-api:${{ steps.meta.outputs.sha }}
      - name: Generate OpenAPI schema
        run: |
          cd backend
          pip install uv && uv sync --frozen
          # `uv run` executes inside the synced .venv; bare `python` would be the
          # system interpreter without fastapi and fail on `from main import app`.
          uv run python -c "
          import json, os
          os.environ.update({
            'DATABASE_URL': 'sqlite+aiosqlite:///:memory:',
            'COGNITO_REGION': 'eu-west-1', 'COGNITO_USER_POOL_ID': 'eu-west-1_TEST',
            'COGNITO_CLIENT_ID': 'test-client-id', 'COGNITO_CLIENT_SECRET': 'test-client-secret',
            'COGNITO_DOMAIN': 'test-domain', 'JWT_EXPIRY_SECONDS': '86400',
            'ALLOWED_ORIGINS': '[\"http://localhost\"]',
            'CSRF_SECRET_KEY': 'test-secret-key-minimum-32-chars!!',
            'APP_BASE_URL': 'http://localhost',
          })
          from main import app; print(json.dumps(app.openapi()))
          " > ../frontend/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/openapi.json

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-backend
        with:
          env-name: staging
          image-tag: ${{ needs.build-and-push.outputs.image-tag }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

  deploy-frontend-staging:
    needs: deploy-staging
    # No ENABLE_PROD gate: staging is bootstrapped, so the SPA ships on every
    # push to main. The build is env-agnostic (relative same-origin API paths,
    # no VITE_* baked in) — the same dist works for any environment; only the
    # S3 bucket + CloudFront distribution differ. Runs after the backend so the
    # reverse-proxied API is already live behind CloudFront.
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws s3 sync dist/ s3://${{ vars.S3_FRONTEND_BUCKET_STAGING }}/ --delete
      - run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_STAGING }} \
            --paths "/*"

  deploy-production:
    needs: deploy-staging
    # Dormant until prod is bootstrapped (image pushed, api secret populated,
    # ApplicationStack-prod deployed once via the phase-1/phase-2 local runbook).
    # A fresh prod ApplicationStack cannot stabilize Express in one CI pass
    # (empty secret + unreachable new RDS). Set repo variable ENABLE_PROD=true
    # to activate this job — deploy-frontend gates on the same variable.
    if: vars.ENABLE_PROD == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-backend
        with:
          env-name: prod
          image-tag: ${{ needs.build-and-push.outputs.image-tag }}
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

  deploy-frontend:
    needs: deploy-production
    # Same gate as deploy-production: the frontend build+sync targets the prod
    # bucket/distribution, which only exist once prod is bootstrapped.
    if: vars.ENABLE_PROD == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws s3 sync dist/ s3://${{ vars.S3_FRONTEND_BUCKET_PROD }}/ --delete
      - run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*"
