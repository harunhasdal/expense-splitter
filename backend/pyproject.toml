[project]
name = "expense-splitter-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # fastapi 0.141 / starlette 1.6 clears the starlette 0.37.2 CVEs
    # (PYSEC-2026-248/1941/1943/2280/2281). fastapi 0.141 uncaps starlette so a
    # patched 1.x resolves; starlette pinned explicitly to hold the security floor.
    # fastapi 0.141 requires pydantic>=2.9 (2.13 resolved). python-jose 3.5 clears
    # PYSEC-2024-232/233.
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==22.0.0",
    "sqlalchemy[asyncio]==2.0.31",
    "alembic==1.13.2",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.15.0",
    "python-jose[cryptography]==3.5.0",
    "httpx==0.27.0",
    "structlog==24.2.0",
    "itsdangerous==2.2.0",
    "hypothesis==6.103.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=70"
omit = ["auth/service.py", "auth/router.py", "auth/middleware.py", "auth/repository.py", "migrations/*"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are *meant* to be called in argument
# defaults; that is the framework's idiom, not the B008 mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; don't reflow the long sa.Column(...) DDL lines.
"migrations/versions/*.py" = ["E501"]
